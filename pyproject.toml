[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "responder-readiness-forecaster"
version = "0.3.0"
description = "Synthetic, advisory multi-agent forecaster for team-level responder readiness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
responder-forecaster = "responder_forecaster.cli:main"
responder-forecaster-gui = "responder_forecaster.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
responder_forecaster = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.setuptools.data-files]
"share/responder-readiness-forecaster/data/public" = ["data/public/*.json"]
"share/responder-readiness-forecaster/data/synthetic/scenarios" = ["data/synthetic/scenarios/*.json"]
"share/responder-readiness-forecaster/data/synthetic/showcase" = ["data/synthetic/showcase/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
